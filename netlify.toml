# Netlify deployment: the web app, proxied to the API.
#
# Why a proxy rather than a separate API host: the browser must see one origin,
# or the session cookie set by the API belongs to a different site than the page
# that needs it. Requests to /api/*, /auth/* and /health are rewritten to the
# Vercel deployment, which serves both the app and the API, so Netlify is a
# second front door to the same origin rather than a second backend.
#
# The API's own deploy step provisions the database and runs the migrations;
# Netlify never touches the database.
#
# Why the canonical host and not one of the platform's own hostnames: the
# deployment answers to inicio.unifies.codes, inicio-prjct.vercel.app and
# inicio-six-psi.vercel.app, and a probe of all three on 2026-10-14 returned the
# same compute start time to the millisecond and the same database (10 migrations,
# PostgreSQL 18.6) — one service under three names, not three deployments. Naming
# the canonical one keeps this file agreeing with the README, the badges, the
# sitemap and robots.txt, and `apps/web/test/sitemap.test.ts` holds it there.

[build]
  command = "pnpm --filter @inicio/web build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"
  # Netlify installs the workspace before running the workspace build command.
  NPM_FLAGS = "--version"

# API first, so the catch-all SPA rule below cannot swallow it.
[[redirects]]
  from = "/api/*"
  to = "https://inicio.unifies.codes/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/auth/*"
  to = "https://inicio.unifies.codes/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "https://inicio.unifies.codes/health"
  status = 200
  force = true

# Single page application: every other path renders the app shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
