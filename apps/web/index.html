<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Build forms with real logic, circulate them, and collect answers that survive a bad connection. Open source, invite only, no trackers."
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#05070d" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!--
      The tab icon. Without a declared `icon`, every browser asks for `/favicon.ico`
      whether or not it exists — this deployment has no such file, so the console
      carried a 404 on every visit and the tab showed a blank page glyph. The
      manifest's icons are for installs, not for the tab; these are for the tab.
    -->
    <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="icon" href="/icon-512.png" sizes="512x512" type="image/png" />
    <!-- iOS ignores the web manifest; these are its equivalents. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Inicio" />
    <!--
      Two faces: a wide variable grotesk for the interface and the headlines, and one
      italic serif for the few places a sentence should sound like a person wrote it.
      Preconnected because the first paint waits for them, and `display=swap` so a
      slow font never holds the text back on a bad connection, which is exactly the
      connection this product is built for.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,300..900&family=Instrument+Serif:ital@1&display=swap"
      rel="stylesheet"
    />
    <title>Inicio · survey and data collection</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
