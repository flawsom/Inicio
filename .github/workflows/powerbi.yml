name: Power BI reports

# A PBIP is a deliverable, not a by-product, and the two ways its proof silently stops
# being true are cheap to check and expensive to discover in a client meeting:
#
#   1. a generator that no longer parses (a stray token in a template string), which
#      every downstream check would report as a mysterious empty page; and
#   2. a package that still contains pages from an earlier build. `zip -qr` updates an
#      archive in place, and page ids are random per build, so a stale page survives as
#      a duplicate under a new id - that is how a 477-visual build once validated as
#      557 visuals inside the delivered zip.
#
# So this rebuilds the data-driven ORACURA report from the evaluations CSV committed
# beside it, validates the project folder, validates the zip it just wrote, and compares
# both against the build manifest's own page and visual counts. The five questionnaire
# dossiers are covered by `pnpm powerbi:test` in ci.yml; this job exists because the
# data-driven report is not part of that suite.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'scripts/**'
      - 'reports/power-bi/**'
      - '.github/workflows/powerbi.yml'

concurrency:
  group: powerbi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oracura:
    name: rebuild, validate, package, count
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Same gate the README documents: every .mjs parses before anything runs it.
      - name: Syntax gate
        run: node scripts/check-syntax.mjs

      # The extractor is importable without openpyxl (that import is lazy, inside
      # extract()), so this needs no Python packages. It proves the rules still
      # reproduce the shipped Family column on all 220 product names.
      - name: Extractor rules reproduce the shipped CSV
        run: python3 scripts/test-oracura-extractor.py

      - name: Build the PBIP from the committed data
        run: node scripts/build-oracura-powerbi.mjs

      - name: Validate the project folder
        run: |
          node scripts/validate-pbip.mjs reports/power-bi/oracura \
            --data reports/power-bi/oracura/data/evaluations.csv \
            --dimensions City,Age,Gender,Family \
            --manifest reports/power-bi/oracura/report-manifest.json --strict-relationship

      - name: Drillthrough bindings
        run: node scripts/verify-drillthrough.mjs

      # Deleting first is the fix for the stale-page failure above, not hygiene. The
      # script also normalises mtimes and writes with TZ=UTC and zip -X, so the archive
      # is a function of the build rather than of the machine that packaged it.
      - name: Package the deliverable reproducibly
        run: node scripts/package-oracura.mjs

      # The count check lives in the validator: with --manifest it compares page ids,
      # page count and visual count against the build that produced them, so a zip that
      # still carries an earlier build's pages fails here rather than at the client.
      - name: Validate the zip, including page and visual counts
        run: |
          node scripts/validate-pbip.mjs reports/power-bi/ORACURA_Module1_PBIP.zip \
            --data reports/power-bi/oracura/data/evaluations.csv \
            --dimensions City,Age,Gender,Family \
            --manifest reports/power-bi/oracura/report-manifest.json --strict-relationship

      # A reproducible build is a claim, so it is tested rather than asserted: rebuild
      # and repackage from the commit, then require the result to be byte-identical to the
      # artifacts that are actually committed. Comparing two fresh runs would not catch a
      # stale committed zip or a generator change that only lives in the commit's parent.
      # This is the step that would have caught the theme file that no longer matched its
      # generator, and the committed dossier folders doing the same.
      - name: Rebuild and repackage, require byte-identical committed artifacts
        run: |
          set -euo pipefail
          committed=$(sha256sum reports/power-bi/ORACURA_Module1_PBIP.zip | cut -d' ' -f1)
          node scripts/build-oracura-powerbi.mjs
          node scripts/package-oracura.mjs
          rebuilt=$(sha256sum reports/power-bi/ORACURA_Module1_PBIP.zip | cut -d' ' -f1)
          test "$committed" = "$rebuilt" || { echo "committed zip $committed != rebuilt zip $rebuilt"; exit 1; }
          git diff --exit-code -- reports/power-bi/oracura reports/power-bi/ORACURA_Module1_PBIP.zip \
            || { echo "committed report differs from a rebuild:"; git diff --stat -- reports/power-bi/oracura; exit 1; }
          echo "ORACURA archive and tree reproduce: $committed"

      - name: Package the five dossiers reproducibly
        run: node scripts/package-dossiers.mjs

      - name: Dossier archives match their folders byte for byte
        run: |
          set -euo pipefail
          git diff --exit-code -- 'reports/power-bi/*_PBIP.zip' \
            || { echo "a committed dossier zip differs from its folder"; git diff --stat -- 'reports/power-bi/*_PBIP.zip'; exit 1; }
          echo "dossier archives reproduce"
