<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780" role="img" aria-label="The Inicio console: forms list, definition editor, analyser findings and live version status">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06080f"/><stop offset="1" stop-color="#0c1322"/>
    </linearGradient>
    <radialGradient id="cglow" cx="0.85" cy="0.05" r="0.6">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.16"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="780" rx="22" fill="url(#cbg)"/>
  <rect width="1280" height="780" rx="22" fill="url(#cglow)"/>
  <rect x="0.75" y="0.75" width="1278.5" height="778.5" rx="21.5" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">

    <!-- top bar -->
    <rect x="1" y="1" width="1278" height="62" rx="21" fill="#ffffff" fill-opacity="0.03"/>
    <rect x="1" y="56" width="1278" height="1" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="24" y="18" width="28" height="28" rx="8" fill="#0f172a" stroke="#ffffff" stroke-opacity="0.14"/>
    <rect x="33" y="26" width="10" height="3" rx="1.5" fill="#e2e8f0"/>
    <rect x="33" y="32" width="10" height="3" rx="1.5" fill="#e2e8f0"/>
    <rect x="33" y="38" width="6" height="3" rx="1.5" fill="#38bdf8"/>
    <text x="64" y="38" font-size="16" font-weight="700" fill="#e8eef9">Inicio</text>
    <rect x="132" y="20" width="150" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="146" y="38" font-size="13" fill="#b6c4d8">Inicio · owner</text>
    <rect x="1042" y="20" width="212" height="26" rx="13" fill="#34d399" fill-opacity="0.10" stroke="#34d399" stroke-opacity="0.30"/>
    <text x="1058" y="38" font-size="12.5" fill="#6ee7b7">published v2 · collecting</text>

    <!-- sidebar -->
    <rect x="1" y="63" width="286" height="716" fill="#ffffff" fill-opacity="0.02"/>
    <rect x="286" y="63" width="1" height="716" fill="#ffffff" fill-opacity="0.08"/>
    <text x="28" y="100" font-size="11" font-weight="700" letter-spacing="1.4" fill="#6b7c95">FORMS</text>
    <rect x="18" y="114" width="252" height="42" rx="12" fill="#38bdf8" fill-opacity="0.10" stroke="#38bdf8" stroke-opacity="0.28"/>
    <text x="36" y="140" font-size="14" font-weight="600" fill="#e8eef9">School Ranking Survey 2026</text>
    <text x="36" y="182" font-size="13.5" fill="#93a1b8">Form A</text>
    <text x="36" y="216" font-size="13.5" fill="#93a1b8">B form</text>
    <text x="36" y="250" font-size="13.5" fill="#93a1b8">B form in A</text>
    <rect x="18" y="690" width="252" height="1" fill="#ffffff" fill-opacity="0.08"/>
    <text x="36" y="720" font-size="12.5" fill="#6b7c95">People and invitations</text>
    <text x="36" y="748" font-size="12.5" fill="#6b7c95">Templates</text>

    <!-- main header -->
    <text x="322" y="112" font-size="24" font-weight="700" fill="#eef4fd">School Ranking Survey 2026</text>
    <text x="322" y="138" font-size="13" fill="#8394ad">5 responses · 3 in progress · live reads, refreshed on focus</text>

    <!-- tabs -->
    <rect x="322" y="158" width="252" height="36" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="326" y="162" width="80" height="28" rx="8" fill="#ffffff" fill-opacity="0.10"/>
    <text x="344" y="181" font-size="12.5" font-weight="600" fill="#e8eef9">Builder</text>
    <text x="424" y="181" font-size="12.5" fill="#93a1b8">Responses</text>
    <text x="504" y="181" font-size="12.5" fill="#93a1b8">Distribute</text>

    <!-- definition panel -->
    <rect x="322" y="216" width="620" height="510" rx="16" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.10"/>
    <text x="346" y="248" font-size="12" font-weight="700" letter-spacing="1.2" fill="#6b7c95">DEFINITION · JSON</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
      <text x="346" y="284" fill="#7dd3fc">{</text>
      <text x="362" y="308" fill="#93a1b8">"title":</text>
      <text x="440" y="308" fill="#c4b5fd">"School Ranking Survey 2026"</text>
      <text x="346" y="336" fill="#93a1b8">"questions": [</text>
      <text x="362" y="360" fill="#7dd3fc">{</text>
      <text x="378" y="384" fill="#93a1b8">"name":</text>
      <text x="448" y="384" fill="#c4b5fd">"enrolment"</text>
      <text x="378" y="408" fill="#93a1b8">"type":</text>
      <text x="448" y="408" fill="#c4b5fd">"integer"</text>
      <text x="378" y="432" fill="#93a1b8">"validation":</text>
      <text x="488" y="432" fill="#6ee7b7">{ "constraint": ". &gt;= 0" }</text>
      <text x="378" y="456" fill="#93a1b8">"rules":</text>
      <text x="448" y="456" fill="#fcd34d">{ "visibleIf": "${level} = 'secondary'" }</text>
      <text x="362" y="480" fill="#7dd3fc">}</text>
      <text x="346" y="504" fill="#93a1b8">]</text>
      <text x="346" y="528" fill="#7dd3fc">}</text>
    </g>
    <!-- analyser strip -->
    <rect x="346" y="556" width="572" height="1" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="346" y="580" width="12" height="12" rx="4" fill="#34d399"/>
    <text x="370" y="591" font-size="13" fill="#a9b8cd">Analyser: 0 errors · 1 warning — <tspan fill="#fcd34d">"enrolment" is only sometimes visible</tspan></text>
    <rect x="346" y="618" width="150" height="34" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="368" y="640" font-size="12.5" font-weight="600" fill="#dbe6f5">Save draft</text>
    <rect x="508" y="618" width="182" height="34" rx="10" fill="#38bdf8" fill-opacity="0.16" stroke="#38bdf8" stroke-opacity="0.45"/>
    <text x="530" y="640" font-size="12.5" font-weight="600" fill="#7dd3fc">Publish this version</text>

    <!-- right rail -->
    <rect x="966" y="216" width="290" height="246" rx="16" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.10"/>
    <text x="990" y="248" font-size="12" font-weight="700" letter-spacing="1.2" fill="#6b7c95">VERSIONS</text>
    <rect x="990" y="266" width="242" height="34" rx="10" fill="#38bdf8" fill-opacity="0.10" stroke="#38bdf8" stroke-opacity="0.30"/>
    <text x="1006" y="288" font-size="13" fill="#e8eef9">v2 · published</text>
    <text x="990" y="324" font-size="13" fill="#93a1b8">v1 · archived</text>
    <text x="990" y="352" font-size="12.5" fill="#6b7c95">Published versions are immutable.</text>
    <text x="990" y="372" font-size="12.5" fill="#6b7c95">Restoring creates a new version.</text>
    <text x="990" y="404" font-size="12" font-weight="700" letter-spacing="1.2" fill="#6b7c95">TENANCY</text>
    <text x="990" y="430" font-size="12.5" fill="#6ee7b7">Row-level security: enforced</text>
    <text x="990" y="450" font-size="12.5" fill="#6b7c95">role app_role · FORCE RLS</text>

    <rect x="966" y="480" width="290" height="246" rx="16" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.10"/>
    <text x="990" y="512" font-size="12" font-weight="700" letter-spacing="1.2" fill="#6b7c95">DISTRIBUTE</text>
    <text x="990" y="542" font-size="13" fill="#a9b8cd">Live against published v2</text>
    <rect x="990" y="560" width="242" height="34" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="1006" y="582" font-size="12.5" fill="#dbe6f5">Create anonymous link</text>
    <rect x="990" y="604" width="242" height="34" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="1006" y="626" font-size="12.5" fill="#dbe6f5">Create single-use link</text>
    <text x="990" y="668" font-size="12.5" fill="#6b7c95">The token is shown once. Only its</text>
    <text x="990" y="686" font-size="12.5" fill="#6b7c95">hash is stored — not even you can</text>
    <text x="990" y="704" font-size="12.5" fill="#6b7c95">read it back.</text>
  </g>
</svg>
