    <text x="36" y="720" font-size="12" fill="#9ca3af">Row-level security: on</text>
    <text x="36" y="744" font-size="12" fill="#9ca3af">Least-privilege role: app_role</text>
    <text x="311" y="106" font-size="22" font-weight="700" fill="#f4f2ef">People and invitations</text>
    <text x="311" y="132" font-size="13" font-weight="400" fill="#a8a5a0">Accounts are invitation only. One link, one person — a link stops working the moment it is used.</text>
