    <text x="805" y="589" font-size="10.8" font-weight="400" fill="#9ca3af">changes</text>
    <rect x="1019" y="522" width="216" height="66" rx="12" fill="#ffffff" fill-opacity="0.03" stroke="#a8a5a0" stroke-opacity="0.22"/>
    <rect x="1033" y="534" width="61" height="22" rx="11" fill="#a8a5a0" fill-opacity="0.10" stroke="#a8a5a0" stroke-opacity="0.30"/>
    <text x="1043" y="549" font-size="11" font-weight="600" fill="#a8a5a0">viewer</text>
    <text x="1033" y="574" font-size="10.8" font-weight="400" fill="#9ca3af">read responses and exports</text>
    <text x="1033" y="589" font-size="10.8" font-weight="400" fill="#9ca3af">only</text>
    <rect x="311" y="634" width="945" height="118" rx="16" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="335" y="664" font-size="11" font-weight="700" letter-spacing="1.4" fill="#9ca3af">CONSENT WITH EVIDENCE, NOT A CHECKBOX</text>
    <text x="335" y="692" font-size="12.5" font-weight="400" fill="#a8a5a0">Accepting the terms writes a row: policy version, exact text hash, timestamp, IP address and user agent.</text>
    <text x="335" y="714" font-size="12.5" font-weight="400" fill="#a8a5a0">The record is append-only and tenant-scoped, so “who agreed to what, and when” is answerable months later.</text>
    <text x="335" y="738" font-size="12" font-weight="500" fill="#fdba74" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">terms_acceptance(user_id, policy_version, text_sha256, accepted_at, ip, user_agent)</text>
    <text x="1010" y="692" font-size="11.5" font-weight="400" fill="#9ca3af">Illustration of the</text>
    <text x="1010" y="710" font-size="11.5" font-weight="400" fill="#9ca3af">running console.</text>
