    <text x="1034" y="444" font-size="11.5" font-weight="400" fill="#a8a5a0">accepted once, then dead</text>
    <circle cx="1021" cy="462" r="3.5" fill="#fdba74" fill-opacity="0.85"/>
    <text x="1034" y="466" font-size="11.5" font-weight="400" fill="#a8a5a0">revocation is immediate</text>
    <rect x="311" y="476" width="945" height="134" rx="16" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="335" y="506" font-size="11" font-weight="700" letter-spacing="1.4" fill="#9ca3af">ROLES — ENFORCED BY ROW LEVEL SECURITY, NOT BY THE INTERFACE</text>
    <rect x="335" y="522" width="216" height="66" rx="12" fill="#ffffff" fill-opacity="0.03" stroke="#ea580c" stroke-opacity="0.22"/>
    <rect x="349" y="534" width="54" height="22" rx="11" fill="#ea580c" fill-opacity="0.10" stroke="#ea580c" stroke-opacity="0.30"/>
    <text x="359" y="549" font-size="11" font-weight="600" fill="#ea580c">owner</text>
    <text x="349" y="574" font-size="10.8" font-weight="400" fill="#9ca3af">everything, including billing</text>
    <text x="349" y="589" font-size="10.8" font-weight="400" fill="#9ca3af">and roles</text>
    <rect x="563" y="522" width="216" height="66" rx="12" fill="#ffffff" fill-opacity="0.03" stroke="#fdba74" stroke-opacity="0.22"/>
    <rect x="577" y="534" width="54" height="22" rx="11" fill="#fdba74" fill-opacity="0.10" stroke="#fdba74" stroke-opacity="0.30"/>
    <text x="587" y="549" font-size="11" font-weight="600" fill="#fdba74">admin</text>
    <text x="577" y="574" font-size="10.8" font-weight="400" fill="#9ca3af">people, forms, distribution,</text>
    <text x="577" y="589" font-size="10.8" font-weight="400" fill="#9ca3af">exports</text>
