<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 620" width="1020" height="620" role="img" aria-label="Signing in: an emailed one-time code, invitation-only accounts, and the single reply a code request can produce">
  <defs>
    <linearGradient id="thbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06080f"/><stop offset="1" stop-color="#0c1322"/>
    </linearGradient>
    <radialGradient id="thglow" cx="0.5" cy="0.1" r="0.75">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.20"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1020" height="620" rx="22" fill="url(#thbg)"/>
  <rect width="1020" height="620" rx="22" fill="url(#thglow)"/>
  <rect x="0.75" y="0.75" width="1018.5" height="618.5" rx="21.5" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">

    <rect x="70" y="86" width="54" height="54" rx="15" fill="#0f172a" stroke="#ffffff" stroke-opacity="0.14"/>
    <rect x="85" y="101" width="24" height="5" rx="2.5" fill="#e2e8f0"/>
    <rect x="85" y="111" width="24" height="5" rx="2.5" fill="#e2e8f0"/>
    <rect x="85" y="121" width="14" height="5" rx="2.5" fill="#38bdf8"/>

    <text x="70" y="190" font-size="30" font-weight="700" fill="#eef4fd">Sign in to Inicio</text>
    <text x="70" y="220" font-size="14" fill="#8394ad">A one-time code is emailed to the address you were invited as.</text>

    <text x="70" y="286" font-size="13" font-weight="600" fill="#c3d0e2">Email address</text>
    <rect x="70" y="300" width="450" height="50" rx="12" fill="#0b1120" stroke="#38bdf8" stroke-opacity="0.45"/>
    <text x="90" y="331" font-size="14" fill="#eef4fd">you@your-organisation.org</text>

    <rect x="70" y="368" width="200" height="46" rx="12" fill="#38bdf8" fill-opacity="0.18" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="98" y="397" font-size="14" font-weight="700" fill="#bae6fd">Send me a code</text>

    <text x="70" y="462" font-size="13" font-weight="600" fill="#c3d0e2">Six-digit code</text>
    <g>
      <rect x="70" y="476" width="46" height="56" rx="12" fill="#0b1120" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="86" y="513" font-size="22" font-weight="700" fill="#eef4fd">4</text>
      <rect x="126" y="476" width="46" height="56" rx="12" fill="#0b1120" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="142" y="513" font-size="22" font-weight="700" fill="#eef4fd">2</text>
      <rect x="182" y="476" width="46" height="56" rx="12" fill="#0b1120" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="198" y="513" font-size="22" font-weight="700" fill="#eef4fd">9</text>
      <rect x="238" y="476" width="46" height="56" rx="12" fill="#0b1120" stroke="#38bdf8" stroke-opacity="0.7"/>
      <text x="254" y="513" font-size="22" font-weight="700" fill="#7dd3fc">7</text>
      <rect x="294" y="476" width="46" height="56" rx="12" fill="#0b1120" stroke="#ffffff" stroke-opacity="0.16"/>
      <rect x="350" y="476" width="46" height="56" rx="12" fill="#0b1120" stroke="#ffffff" stroke-opacity="0.16"/>
      <rect x="406" y="476" width="46" height="56" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.10"/>
    </g>
    <text x="464" y="510" font-size="12.5" fill="#6b7c95">10-minute TTL · 3 attempts</text>

    <!-- reply panel -->
    <rect x="600" y="256" width="360" height="288" rx="18" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.10"/>
    <text x="624" y="290" font-size="12" font-weight="700" letter-spacing="1.2" fill="#6b7c95">WHAT A CODE REQUEST ANSWERS</text>
    <rect x="624" y="306" width="312" height="72" rx="12" fill="#0b1120" stroke="#34d399" stroke-opacity="0.35"/>
    <text x="644" y="338" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#6ee7b7">{ "status": "sent" }</text>
    <text x="644" y="360" font-size="11.5" fill="#6b7c95">the only successful reply that exists</text>

    <rect x="624" y="394" width="312" height="72" rx="12" fill="#0b1120" stroke="#fb7185" stroke-opacity="0.35"/>
    <text x="644" y="426" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#fda4af">{ "error": "not_invited" }</text>
    <text x="644" y="448" font-size="11.5" fill="#6b7c95">an unknown address is never a special case</text>

    <text x="624" y="500" font-size="12.5" fill="#a9b8cd">No code is ever echoed to a client, and there is no</text>
    <text x="624" y="520" font-size="12.5" fill="#a9b8cd">path that creates an account from outside the product.</text>

    <rect x="70" y="560" width="890" height="1" fill="#ffffff" fill-opacity="0.08"/>
    <text x="70" y="588" font-size="12.5" fill="#6b7c95">Codes are hashed with sha256 plus a server-side pepper. Sessions are httpOnly, Secure and SameSite=Lax.</text>
  </g>
</svg>
