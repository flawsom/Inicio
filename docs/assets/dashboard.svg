    <rect x="311" y="634" width="945" height="118" rx="16" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="335" y="664" font-size="11" font-weight="700" letter-spacing="1.4" fill="#9ca3af">WHY THIS SCREEN CAN SAY “LIVE”</text>
    <text x="335" y="692" font-size="12.5" font-weight="400" fill="#a8a5a0">Every figure is recomputed inside a tenant-scoped transaction. The organisation is a parameter of the</text>
    <text x="335" y="712" font-size="12.5" font-weight="400" fill="#a8a5a0">connection, not a filter the application remembers to apply — PostgreSQL enforces it.</text>
    <text x="335" y="736" font-size="12" font-weight="500" fill="#ea580c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">SELECT count(*) FROM response WHERE org_id = current_setting('app.org_id')::uuid;</text>
